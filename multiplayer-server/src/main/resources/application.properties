server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
game.allowed-origins=${GAME_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
game.reconnect-seconds=${GAME_RECONNECT_SECONDS:60}
game.max-rooms=${GAME_MAX_ROOMS:500}

# Accounts persist independently of rooms; override with your Lightsail MySQL database.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/santorini;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
auth.secure-cookie=${AUTH_SECURE_COOKIE:false}
auth.session-hours=${AUTH_SESSION_HOURS:168}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
