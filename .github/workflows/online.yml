name: Online game checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: ./mvnw -B verify
      - run: npm ci && npm run build
        working-directory: web-client
      - run: npx playwright install --with-deps chromium
        working-directory: web-client
      - name: Start multiplayer server
        run: |
          java -jar multiplayer-server/target/multiplayer-server-1.0.0-SNAPSHOT.jar > server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/actuator/health; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - run: npm test && npm run test:e2e
        working-directory: web-client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-browser-checks
          path: |
            web-client/test-results
            web-client/playwright-report
            server.log
